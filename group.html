<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กลุ่มงานป้าย - ChiiSAnA ♡ 花</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pastel: #FFEEF9;
            --main-pink: #ffdae9;
            --dark-menu: #332d2d;
            --glass-white: rgba(255, 255, 255, 0.85);
            --text-gray: #5d5151;
            --accent-pink: #ff85b3;
            --glow-color: rgba(255, 133, 179, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }

        body {
            background-color: var(--bg-pastel); 
            background-image: 
                radial-gradient(white 1.5px, transparent 1.5px), 
                radial-gradient(white 1.5px, transparent 1.5px); 
            background-size: 25px 25px; 
            background-position: 0 0, 12.5px 12.5px; 
            background-attachment: fixed; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding-bottom: 120px; 
            color: var(--text-gray);
            overflow-x: hidden;
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            padding: 20px; 
            position: relative;
            z-index: 10;
        }

        /* --- ✨ Header --- */
        .header-section {
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 30px 15px;
            text-align: center;
            margin-bottom: 25px;
            border: 2px solid white;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
        }
        .header-section h2 { color: var(--accent-pink); font-size: 24px; margin-bottom: 8px; }
        .header-section p { font-size: 13px; opacity: 0.8; }

        /* --- 🎀 Category Divider --- */
        .category-divider {
            display: flex;
            align-items: center;
            margin: 40px 0 20px;
        }
        .category-divider::before, .category-divider::after {
            content: ""; flex: 1; border-bottom: 2px solid white;
        }
        .category-title {
            background: white;
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-gray);
            margin: 0 15px;
            border: 1px solid var(--main-pink);
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.1);
        }

        /* --- 🖼️ Labels Grid --- */
        .labels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .portfolio-card {
            background: var(--glass-white);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 12px;
            text-decoration: none;
            color: var(--text-gray);
            border: 2px solid white;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 15px rgba(255, 182, 193, 0.1);
        }

        .portfolio-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px rgba(255, 133, 179, 0.2);
            background: white;
        }

        .portfolio-card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            border-radius: 20px; 
            margin-bottom: 12px; 
        }

        .portfolio-card span { 
            font-size: 13px; 
            font-weight: 500; 
            text-align: center; 
            margin-bottom: 8px;
            display: block;
        }

        .badges { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 4px; 
            justify-content: center; 
            margin-bottom: 10px;
            min-height: 40px;
        }

        .badge { 
            font-size: 9px; 
            padding: 2px 8px; 
            border-radius: 50px; 
            background: #fff0f6; 
            color: var(--accent-pink); 
            border: 1px solid var(--main-pink); 
        }

        .price-tag {
            margin-top: auto;
            background: linear-gradient(135deg, var(--accent-pink), #ff6b9d);
            color: white;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            padding: 8px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(255, 133, 179, 0.3);
        }

        /* --- 🧭 Nav --- */
        .bottom-nav { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 420px; background: var(--dark-menu); 
            display: flex; justify-content: space-around; padding: 12px 5px; 
            border-radius: 25px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .nav-item { 
            text-decoration: none; color: white; font-size: 10px; 
            text-align: center; opacity: 0.6; transition: 0.3s; flex: 1; 
        }

        .nav-item.active { opacity: 1; color: var(--main-pink); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 3px; font-style: normal; }

        /* --- 🧸 Stickers --- */
        .floating-sticker { position: fixed; bottom: 95px; right: 25px; width: 85px; z-index: 999; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        .bg-chiikawa { position: fixed; pointer-events: none; z-index: 1; opacity: 0.2; }
    </style>
</head>
<body>

    <div id="bg-chiikawa-container"></div>
    <img src="จิบิจิ๋ว (27).png" alt="Sticker" class="floating-sticker">

    <div class="container">
        <div class="header-section">
            <h2>📁 กลุ่มงานป้ายในเครือ ♡</h2>
            <p>รวมกลุ่มงานที่เค้าดึงเมลเอง รับรองไวทันใจแน่นอนค่าาา ૮˃ ꒳ ˂า</p>
        </div>

        <div class="category-divider">
            <div class="category-title">♡ Block grou𝓅 ♡</div>
        </div>
        <div class="labels-grid">
            <a href="#" class="portfolio-card">
                <img src="White rose Box.jpg" alt="White rose">
                <span>White rose Box</span>
                <div class="badges">
                    <div class="badge">⭐ กลุ่มยอดฮิต</div>
                    <div class="badge">💮 แนวเฮด</div>
                </div>
                <div class="price-tag">ราคา 129.-</div>
            </a>

            <a href="#" class="portfolio-card">
                <img src="Pinkpersona box.jpg" alt="Pinkpersona">
                <span>Pinkpersona box</span>
                <div class="badges">
                    <div class="badge">✅ อัพงานครบ</div>
                </div>
                <div class="price-tag">ราคา 79.-</div>
            </a>
            
            </div>

        <div class="category-divider">
            <div class="category-title">♡ Decoration ♡</div>
        </div>
        <div class="labels-grid">
            <a href="#" class="portfolio-card">
                <img src="Locker ตู้เก็บของ.jpg" alt="Locker">
                <span>Locker ตู้เก็บของ</span>
                <div class="badges">
                    <div class="badge">📁 กลุ่มรวม</div>
                </div>
                <div class="price-tag">ราคา 69.-</div>
            </a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i>🏠</i>Home</a>
        <a href="group.html" class="nav-item active"><i>📂</i>เค้าดึงเมล</a>
        <a href="anothergroup.html" class="nav-item"><i>🎀</i>กลุ่มอื่นๆ</a>
        <a href="work.html" class="nav-item"><i>🎨</i>สั่งป้าย</a>
        <a href="contact.html" class="nav-item"><i>💬</i>Contact</a>
    </nav>

    <script>
        // สร้าง Chiikawa ลอยหลังพื้นหลัง
        const bgContainer = document.getElementById('bg-chiikawa-container');
        for (let i = 0; i < 8; i++) {
            const img = document.createElement('img');
            img.src = 'chiikawa 3.gif'; 
            img.classList.add('bg-chiikawa');
            img.style.width = `${Math.random() * 40 + 40}px`;
            img.style.left = `${Math.random() * 100}vw`;
            img.style.top = `${Math.random() * 100}vh`;
            img.style.animation = `float ${Math.random() * 10 + 10}s linear infinite`;
            bgContainer.appendChild(img);
        }

        const style = document.createElement("style");
        style.innerText = `@keyframes float { 
            0% { transform: translate(0,0) rotate(0deg); } 
            50% { transform: translate(20px, 20px) rotate(10deg); } 
            100% { transform: translate(0,0) rotate(0deg); } 
        }`;
        document.head.appendChild(style);
    </script>
</body>
</html>
